<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrepAI</title>
    <script>
      // Apply the stored theme before first paint, so a dark-mode user never
      // sees a flash of the light palette while React boots.
      try {
        var t = localStorage.getItem('prepai_theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      html { background: #f3f2f2; }
      html[data-theme='dark'] { background: #161514; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
